<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weighment Summary Report</title>
  <style>
       
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #4f46e5;       
            --primary-light: #e0e7ff; 
            --background: #f8fafc;    
            --surface: #ffffff;
            --text-main: #0f172a;    
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;           
            
           
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            -webkit-font-smoothing: antialiased; 
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em; 
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--surface);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(226, 232, 240, 0.8);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

       
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #818cf8);
        }

       
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .card h3 {
            margin: 0;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card .value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 12px;
            letter-spacing: -0.02em;
        }

        .table-container {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            overflow: hidden; /* Keeps the rounded corners over the table */
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background-color: rgba(248, 250, 252, 0.8);
            font-weight: 600;
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        
        tbody tr:hover {
            background-color: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

       
        td strong {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
        }

        .empty-cell {
            color: #cbd5e1;
            font-weight: 400;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Weighment Summary Report</h1>
            <p style="color: var(--text-muted); margin: 0;">Live analysis of recent weighment entries</p>
        </div>

       
        <div class="summary-cards">
            <div class="card">
                <h3>Total Tickets</h3>
                <div class="value" id="totalTickets">0</div>
            </div>
            <div class="card">
                <h3>Total Gross Weight</h3>
                <div class="value" id="totalGross">0</div>
            </div>
            <div class="card">
                <h3>Total Net Weight</h3>
                <div class="value" id="totalNet">0</div>
            </div>
        </div>

      
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Ticket No</th>
                        <th>Date</th>
                        <th>Vehicle No</th>
                        <th>Customer</th>
                        <th>Item</th>
                        <th>Gross Wt</th>
                        <th>Tare Wt</th>
                        <th>Net Wt</th>
                        <th>Charges</th>
                    </tr>
                </thead>
                <tbody id="reportBody">
                    <!-- Rows will populate here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
       

        function generateReport(weighmentData) {
            let totalNet = 0;
            let totalGross = 0;
            let tableHTML = '';

           
            const formatCell = (value) => {
                return value && value.trim() !== "" ? value : '<span class="empty-cell">-</span>';
            };

            weighmentData.forEach(entry => {
               
                totalGross += Number(entry.GrossWeight) || 0;
                totalNet += Number(entry.NetWeight) || 0;

              
                tableHTML += `
                <tr>
                    <td><strong>#${entry.TicketNo}</strong></td>
                    <td>${formatCell(entry.GrossDate)}</td>
                    <td>${formatCell(entry.Vehicale_No)}</td>
                    <td>${formatCell(entry.CustomerName)}</td>
                    <td>${formatCell(entry.ItemName)}</td>
                    <td>${formatCell(entry.GrossWeight)}</td>
                    <td>${formatCell(entry.TareWt)}</td>
                    <td><strong>${formatCell(entry.NetWeight)}</strong></td>
                    <td>${formatCell(entry.Charges)}</td>
                </tr>
            `;
            });

           
            document.getElementById('totalTickets').textContent = weighmentData.length;
          
            document.getElementById('totalGross').textContent = totalGross.toLocaleString();
            document.getElementById('totalNet').textContent = totalNet.toLocaleString();
            document.getElementById('reportBody').innerHTML = tableHTML;
        }



        async function fetchData() {
            try {
                const response = await fetch('https://backend-weightment.onrender.com/api/entries');
                const weighmentData = await response.json();
               
                console.log("Live Data:", weighmentData);
                if (weighmentData.length > 0) {
                    
                    generateReport(weighmentData);
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        // Fetch data every 3 seconds
        setInterval(fetchData, 3000);
        fetchData();
    </script>

</body>

</html>
