<!DOCTYPE html>
<html>
<head>
    <title>Live Report Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>Live Weighment Entries</h2>
    <table id="dataTable">
        <thead>
            <tr id="tableHeaders">
                <!-- Headers will populate dynamically -->
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('https://ankiitpythonanywhere.pythonanywhere.com/api/entries');
                const data = await response.json();
                
                if (data.length > 0) {
                    // Create headers from the first entry's keys
                    const headers = Object.keys(data[0]);
                    document.getElementById('tableHeaders').innerHTML = headers.map(h => `<th>${h}</th>`).join('');
                    
                    // Create rows
                    const rows = data.map(entry => {
                        return '<tr>' + headers.map(h => `<td>${entry[h]}</td>`).join('') + '</tr>';
                    }).join('');
                    
                    document.getElementById('tableBody').innerHTML = rows;
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        // Fetch data every 3 seconds
        setInterval(fetchData, 3000);
        fetchData();
    </script>
</body>
</html>
